{% set faviconApi = "https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=" %}

<ul class="card-list">
    {% for website in websites %}
    <li class="card">
        <a href="/{{website.slug}}">
            <img src="{{ faviconApi}}{{website.homepage}}/&size=128" alt="" loading="lazy" width="128" height="128">
            <h2>{{website.title }}</h2>
            <label for="file">
                <progress id="file" max="100" value="0">0%</progress>
                0%
            </label>
            <ul>
                <li><button><img src="/assets/auditicon.svg" alt="" width="25" height="25"></button></li>
                <li><button><img src="/assets/editicon.svg" alt="" width="25" height="25"></button></li>
                <li><button><img src="/assets/deleteicon.svg" alt="" width="25" height="25"></button></li>
            </ul>
        </a>
    </li>
    {% endfor %}
</ul>
